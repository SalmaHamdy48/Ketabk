<div class="exercises-container">

  <!-- الكارد الوردي: source list -->
  <div class="exercise-card" cdkDropList [cdkDropListData]="questionTypes" [cdkDropListConnectedTo]="['rightList']">
    <div class="exercise-content">
      <h3 class="exercise-title">اسحب نوع السؤال هنا</h3>
      <div *ngFor="let type of questionTypes" cdkDrag>
        <span class="drag-text">{{ type }}</span>
      </div>
    </div>
  </div>

  <!-- الكارد الرمادي: target list -->
  <div class="right-cards" id="rightList" cdkDropList [cdkDropListData]="droppedQuestions" [cdkDropListConnectedTo]="['exerciseCard']" (cdkDropListDropped)="onDrop($event)">
    <div class="full-width-card">
      <p class="full-width-text">اسحب نوع السؤال هنا...</p>
    </div>

    <ng-container *ngFor="let q of droppedQuestions">
      <app-single-choice-card-component *ngIf="q === 'اختيار فردي'"></app-single-choice-card-component>
      <app-multiple-choice-card-component *ngIf="q === 'اختيار من متعدد'"></app-multiple-choice-card-component>
      <app-text-card-component *ngIf="q === 'نص'"></app-text-card-component>
    </ng-container>
  </div>

</div>
